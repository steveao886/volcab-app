# 部署到 GitHub Pages。
#
# 触发:推送到 master 分支 → 安装依赖、跑测试、构建、发布 dist/ 到 Pages。
#
# 最需要注意的一点:仓库的 Settings → Pages → Build and deployment → Source
# 必须手动设为 "GitHub Actions"(默认是 "Deploy from a branch")。没设的话
# deploy 任务会失败,报错信息和"没设 Source"这个真实原因对不上,不好排查。
#
# 另外 vite.config.ts 里 base 写死为 '/volcab-app/',承载本仓库的名字必须是
# volcab-app,发布出来的地址才会是 https://<user>.github.io/volcab-app/ ——
# 仓库名不对的话,页面能部署成功但所有静态资源(JS/CSS/图标)都会 404。
name: deploy

on:
  push:
    branches: [master]
  # 手动触发。2026-08-06 出过一次:四个提交推上 master,GitHub 一个 run 都没
  # 创建(Actions 是 enabled、工作流是 active、仓库 public 没归档、代码确实到了
  # 远端),线上就一直停在上一个构建 —— 功能明明合进去了,打开 app 却看不到。
  # push 触发一旦不灵,没有手动口子就只能靠推空提交去撞运气;这个触发器是从
  # 默认分支读的,不依赖 push 事件,所以那种时候它照样能跑。
  workflow_dispatch:
  # 这里一度还挂过一条 `schedule: */30`,用来在 2026-08-06 的 Actions 故障里
  # 无人值守地重试。**不要再加回来。** 当时的判断是「故障期间的 tick 失败但
  # 无害」,这是错的:拿不到 runner 的任务会被判 cancelled,而每一次都会给仓库
  # 所有者发一封通知邮件 —— 半小时一封,持续整场故障。
  #
  # 定时重试的前提是失败足够安静。GitHub Actions 的失败不安静。

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 不取消进行中的部署,避免生产发布跑到一半被打断而留下半发布状态。
  # 和 GitHub 官方 actions/starter-workflows(pages/*.yml,2026-07 现状)一致。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
